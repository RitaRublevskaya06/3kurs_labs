<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TDWA02-01</title>
    <link rel="stylesheet" href="TDWA02-01.css">
</head>
<body>

<h1>Лабораторная работа 2</h1>

<div class="container">

    <div class="inputs">
        <label>Операция:</label>
        <select id="op">
            <option value="add">Сложение</option>
            <option value="sub">Вычитание</option>
            <option value="mul">Умножение</option>
            <option value="div">Деление</option>
        </select>

        <label>X:</label>
        <input type="number" id="x">

        <label>Y:</label>
        <input type="number" id="y">
    </div>

    <div class="buttons">
        <button onclick="sendGET()">GET</button>
        <button onclick="sendPOST()">POST</button>
        <button onclick="sendPUT()">PUT</button>
        <button onclick="sendDELETE()">DELETE</button>
    </div>

    <div id="result" class="result"></div>

</div>

<script src="TDWA02-01.js"></script>
</body>
</html>
