version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: tdwa06-mssql
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: Str0ngPass!2026
    ports:
      - "10443:1433"
    volumes:
      - mssql-data:/var/opt/mssql

  nginx:
    image: nginx:alpine
    container_name: tdwa06-nginx
    ports:
      - "8080:1433"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  mssql-data: