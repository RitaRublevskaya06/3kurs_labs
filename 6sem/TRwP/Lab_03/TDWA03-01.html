<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TDWA03-01 - HTTPS версия</title>
    <style>
        body {
            font-family: Arial;
            background-color: #c2e0f0;
            text-align: center;
        }
        
        .container {
            background: white;
            padding: 20px;
            width: 500px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        
        .inputs {
            margin-bottom: 15px;
        }
        
        label {
            margin: 5px;
        }
        
        input, select {
            margin: 5px;
            padding: 5px;
        }
        
        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #b8d9f5;
        }
        
        .result {
            margin-top: 20px;
            background: #eee;
            padding: 10px;
            text-align: left;
        }
        
        .protocol-badge {
            background-color: #28a745;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<h1>Лабораторная работа 3</h1>
<div class="protocol-badge">HTTPS (порт 20443)</div>

<div class="container">
    <div class="inputs">
        <label>Операция:</label>
        <select id="op">
            <option value="add">Сложение</option>
            <option value="sub">Вычитание</option>
            <option value="mul">Умножение</option>
            <option value="div">Деление</option>
        </select>

        <label>X:</label>
        <input type="number" id="x" value="10">

        <label>Y:</label>
        <input type="number" id="y" value="5">
    </div>

    <div class="buttons">
        <button onclick="sendGET()">GET</button>
        <button onclick="sendPOST()">POST</button>
        <button onclick="sendPUT()">PUT</button>
        <button onclick="sendDELETE()">DELETE</button>
    </div>

    <div id="result" class="result"></div>
</div>

<script src="TDWA03-01.js"></script>
</body>
</html>
