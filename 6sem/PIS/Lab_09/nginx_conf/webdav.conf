# Этот файл — образец. Рабочий конфиг создаётся скриптом:
#   sh scripts/setup_nginx_wsl.sh
#
# Ubuntu WSL:  /mnt/d/Univer/3_kurs/6sem/PIS/Lab_09/...
# docker-desktop: /mnt/host/d/Univer/3_kurs/6sem/PIS/Lab_09/...

server {
    listen 8081;
    server_name localhost;

    location /webdav/ {
        alias /mnt/d/Univer/3_kurs/6sem/PIS/Lab_09/webdav_data/;

        dav_methods PUT DELETE MKCOL COPY MOVE;
        create_full_put_path on;
        dav_access user:rw group:rw all:rw;

        client_body_temp_path /mnt/d/Univer/3_kurs/6sem/PIS/Lab_09/nginx_temp;
        client_max_body_size 100M;

        auth_basic "WebDAV";
        auth_basic_user_file /mnt/d/Univer/3_kurs/6sem/PIS/Lab_09/nginx_conf/.webdavpasswd;
    }
}
